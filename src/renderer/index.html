<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCanvas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="title-group">
        <span class="app-name">OpenCanvas</span>
        <span class="file-name" id="file-name">No project</span>
      </div>
      <div class="action-group">
        <button id="btn-new" class="primary">New</button>
        <button id="btn-open">Open</button>
        <button id="btn-save">Save</button>
        <button id="btn-export">Export PNG</button>
        <label for="zoom-select" class="sr-only">Zoom</label>
        <select id="zoom-select">
          <option value="fit">Fit</option>
          <option value="0.25">25%</option>
          <option value="0.5">50%</option>
          <option value="1" selected>100%</option>
          <option value="2">200%</option>
          <option value="4">400%</option>
        </select>
      </div>
    </header>
    <div class="main-layout">
      <aside class="side-panel left-panel" aria-label="Tools">
        <h2>Tools</h2>
        <ul id="tool-list">
          <li>
            <button class="tool-button active" data-tool="transform" title="Transform (V)">Transform</button>
          </li>
        </ul>
        <div class="panel-hint">
          Drag images here or into the canvas area to add layers.
        </div>
      </aside>
      <section class="workspace" id="workspace">
        <div id="viewport" class="viewport" data-dropzone>
          <div id="viewport-inner">
            <div id="canvas-container">
              <div id="canvas-stage" class="checkerboard">
                <canvas id="canvas" width="0" height="0"></canvas>
                <canvas id="overlay" class="interaction-layer" width="0" height="0"></canvas>
              </div>
            </div>
          </div>
        </div>
      </section>
      <aside class="side-panel right-panel" aria-label="Layers">
        <h2>Layers</h2>
        <div class="layers-toolbar">
          <button id="btn-layer-up" title="Move layer up">&#9650;</button>
          <button id="btn-layer-down" title="Move layer down">&#9660;</button>
        </div>
        <ul id="layer-list" class="layer-list" tabindex="0" aria-multiselectable="true"></ul>
        <div class="panel-hint">
          Use Ctrl/Shift to select multiple layers.
          Press Delete to remove selected layers.
        </div>
      </aside>
    </div>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
